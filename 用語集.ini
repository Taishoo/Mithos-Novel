# 用語集

本書に登場する人物、地名、神々、精霊、風習などについて記したもの。各項目は分類ごとに、物語に登場する順に配列している。

## 一、人物

**碧（あお）**
過去の記憶を持たず、留尊島の森で目覚めた少年。腕には見慣れぬ紋様が刻まれている。

**茉莉（まり）**
花多塆の首長の娘。花を愛し、とりわけ希少な翡翠葛に強い憧れを抱いている。

**多羽志（たぱし）**
王蓮の妻で、茉莉の母。傷ついた碧を温かく迎え入れ、手当てを施した。

**王蓮（おはす）**
花多塆の首長。妻の多羽志、娘の茉莉とともに村で暮らしている。

**那満（なまん）**
灰場南の祈祷師にして司祭。古い伝承や自然の精霊を重んじる老人。

**温（ぬく）**
那満の孫。灰場南に暮らし、薬草の採取などを通じて祖父の仕事を手伝っている。

**阿虎（あとら）**
灰場南の首長。戦乱の中で町を守ろうとし、火生門山の資源採掘を推し進めている。

**稚晏（ちあん）**
川笋安の首長の娘。歌を愛し、外の世界への強い憧れを抱いている。

**蛮万（ばんばん）**
川笋安の首長で、稚晏の父。娘の身を案じ、厳しい態度で接することがある。

**来也（らや）**
稚晏に仕える侍女であり、幼いころからの親友。稚晏の心情を理解し、親身に支えている。

**翰図（はんず）**
稚晏と来也の幼なじみ。来也と親しい間柄にある。

---

## 二、地名・国家

**花多塆（かたなわん）**
留尊島にある、花々に恵まれた村。王蓮が首長を務めている。

**留尊島（るそんとう）**
碧が旅を始めた島。花の村、火山、平野、沼地など、多様な風土が広がっている。

**屯都市（とんどし）**
屯都総長国の首都。各地の首長が招かれる政治の中心地。

**屯都総長国**
花多塆や灰場南などが属する国。達爾讃帝国との戦争のさなかにある。

**灰場南平野（はいばなん・へいや）**
花多塆の西方に広がる平野。遠方には火生門山がそびえている。

**灰場南（はいばなん）**
火生門山の南に位置する町。火山資源の採掘が行われ、戦争の影響を強く受けている。

**達爾讃帝国（だるさん・ていこく）**
屯都総長国と交戦している帝国。

**火生門山（ひなと・ざん）**
灰場南の北方にそびえる聖なる火山。古くから巨大な火亀の伝承が残されている。

**大明国（だいみん・ごく）**
留尊島の北方にある国。交易先の一つとして、その名が語られている。

**川笋安（かわやん）**
華母乱王朝に属する町。竹林、海岸、沼地に囲まれ、独自の風習や婚礼儀礼が受け継がれている。

**華母乱王朝（かぼらん・おうちょう）**
川笋安が属する王朝。地域には古くからの慣習が残されている。

**美直島（みなおとう）**
留尊島の南の海に位置する島。

**灼嵐山（かんらんざん）**
古い神話に登場する山。天原の住まう地とされている。

---

## 三、神々・神話

**七つの月**
かつて世界の夜空を照らしていた七つの月。長い時の中で六つが姿を消し、最後の一つだけが残されている。

**天原（あまはら）**
世界の創造に深く関わった古き神。人々の祈りの対象となっている。

**照荒神（あぽらき）**
太陽を司る神。かつて火生門山に棲む巨大な火亀を鎮めたと伝えられている。

**真夜璃（まやり）**
月と夜空を司る女神。その名は古くから神話に語り継がれている。

**聖なる竹**
古い神話に登場する竹。人の世の始まりに深く関わると伝えられている。

**猛（たけし）・雅（みやび）**
聖なる竹から生まれたと伝えられる、最初の男と女。

**羅泡（らほう）**
古い伝承にその名が残る、光に惹かれる謎の存在。

**迷い神**
太古に存在した三柱の古神の一柱。彷徨いの中に道を求めたと伝えられる。

**独り神**
太古に存在した三柱の古神の一柱。世界を己のものとすることを望んだという。

**彼ノ楽園（かのらくえん）**
太古の神々の争いの後、天原によって創られたと伝えられる場所。

**彩鶏（さりどり）**
天原に仕える使い魔。聖なる竹にまつわる伝承に登場する。

---

## 四、精霊・怪異

**狗森（ぐばと）**
斑模様の毛を持つ、森の捕食獣。素早く、獲物を執拗に追い続ける習性を持つ。

**埜翁（ぬの）**
土や菌類に覆われた塚に棲む自然の精霊。住まいを荒らした者に災いをもたらすことがある。

**爆固爆固（ばこばこ）**
火生門山に棲む巨大な火亀。かつて照荒神によって深い眠りへと鎮められたと伝えられる。

**邊落禍（べらか）**
沼地に潜む怪物。水底を徘徊し、蔓を用いて獲物を捕らえる。

---

## 五、文化・風習・自然・道具

**薔薇尾刃（ばらお・じん）**
碧が森の川辺で見つけた古びた刃物。旅の中で身を守るために用いている。

**翡翠葛（ひすいかずら）**
深い青色の美しい花を咲かせる蔓植物。留尊島では希少な花として知られている。

**雄蛭木**
沼地や水辺の湿った土地に育つ樹木。川笋安の周辺にも群生している。

**隠姫**
華母乱王朝とその周辺に伝わる風習に従い、外出や日光、家族以外の男性との接触を制限されて育つ娘。美しさを守るための慣習とされる。

**結びの助け**
川笋安の婚礼において、隠姫が新郎新婦の結びを祝福する役目。儀式には縄と歌が用いられる。

**阿海帆（あみはん）**
北東から南西へと吹き渡る季節の風。真夜璃が碧にその名を教える。
